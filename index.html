<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0a0a0a">
  <title>ترتيل — حفظ القرآن بالورش</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    :root {
      --bg: #0f0f0f;
      --surface: #1a1a1a;
      --surface-hover: #242424;
      --text: #e8e8e8;
      --text-dim: #555;
      --accent: #4a9d6a;
      --accent-glow: rgba(74, 157, 106, 0.3);
      --accent-dim: #2a5d3a;
      --error: #c94a4a;
      --error-dim: rgba(201, 74, 74, 0.2);
      --warn: #d4a744;
      --radius: 12px;
    }

    body {
      font-family: 'Amiri', 'Noto Naskh Arabic', 'Times New Roman', serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Top bar ── */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(15,15,15,0.95);
      backdrop-filter: blur(10px);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #222;
    }
    .topbar .title { font-size: 18px; font-weight: 600; color: var(--accent); }
    .topbar select {
      background: var(--surface); color: var(--text);
      border: 1px solid #333; border-radius: 8px;
      padding: 6px 10px; font-size: 14px; font-family: inherit;
      cursor: pointer; max-width: 180px;
    }
    .nav-btns { display: flex; gap: 6px; align-items: center; }
    .nav-btn {
      background: var(--surface); border: 1px solid #333; color: var(--text);
      border-radius: 8px; padding: 6px 12px; font-size: 14px;
      cursor: pointer; font-family: inherit;
    }
    .nav-btn:hover { background: var(--surface-hover); }
    .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .page-jump {
      display: flex; align-items: center; gap: 4px;
      background: var(--surface); border: 1px solid #333;
      border-radius: 8px; padding: 2px 6px;
    }
    .page-jump input {
      width: 42px; text-align: center;
      background: transparent; border: none; color: var(--text);
      font-size: 14px; font-family: inherit;
      outline: none; padding: 4px 0;
      -moz-appearance: textfield;
    }
    .page-jump input::-webkit-outer-spin-button,
    .page-jump input::-webkit-inner-spin-button {
      -webkit-appearance: none; margin: 0;
    }
    .page-jump span { font-size: 12px; color: var(--text-dim); }

    /* ── Page container ── */
    .page-container {
      max-width: 820px;
      margin: 0 auto;
      padding: 12px 8px 160px;
    }

    /* ── Spread layout (2 pages side-by-side on large screens) ── */
    .spread {
      display: flex;
      gap: 4px;
      justify-content: center;
      align-items: flex-start;
    }
    .spread .mushaf-page {
      flex: 1 1 50%;
      max-width: 50%;
      margin-bottom: 0;
    }
    @media (min-width: 1024px) {
      .page-container {
        max-width: 1700px;
        padding: 12px 8px 160px;
      }
      .spread { gap: 6px; }
    }
    @media (max-width: 1023px) {
      .spread .mushaf-page.single-mode {
        max-width: 100%;
      }
      .spread .mushaf-page.right-page + .mushaf-page.left-page {
        display: none;
      }
    }

    /* ── Mushaf page with line overlays ── */
    .mushaf-page {
      position: relative;
      width: 100%;
      margin-bottom: 16px;
      border-radius: var(--radius);
      overflow: hidden;
      background: #fff;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .mushaf-page img { width: 100%; display: block; }

    /* ── Line overlay segments ── */
    .line-segment {
      position: absolute;
      left: 1%; right: 1%;
      transition: all 0.4s ease;
      border-radius: 4px;
      pointer-events: none;
    }
    .line-segment.hidden {
      background: rgba(8, 8, 8, 0.93);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }
    .line-segment.revealed {
      background: transparent;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
    }
    .line-segment.active {
      background: rgba(8, 8, 8, 0.88);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      box-shadow: inset 0 0 0 2px rgba(74, 157, 106, 0.6);
    }
    .line-segment.mistake {
      background: transparent;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      box-shadow: inset 0 0 0 2px rgba(220, 53, 69, 0.8), 0 0 12px rgba(220, 53, 69, 0.3);
      animation: mistake-pulse 0.6s ease;
    }
    /* Mistake on a hidden line: stays hidden (dark overlay) + red border */
    .line-segment.hidden.mistake {
      background: rgba(8, 8, 8, 0.93);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      box-shadow: inset 0 0 0 2px rgba(220, 53, 69, 0.8), 0 0 12px rgba(220, 53, 69, 0.3);
    }
    @keyframes mistake-pulse {
      0% { box-shadow: inset 0 0 0 2px rgba(220, 53, 69, 1), 0 0 20px rgba(220, 53, 69, 0.6); }
      100% { box-shadow: inset 0 0 0 2px rgba(220, 53, 69, 0.8), 0 0 12px rgba(220, 53, 69, 0.3); }
    }

    .page-info {
      text-align: center; font-size: 12px; color: var(--text-dim);
      padding: 4px 0 8px;
    }

    /* ── Bottom controls ── */
    .controls {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(15,15,15,0.95);
      backdrop-filter: blur(10px);
      padding: 14px 16px 10px;
      border-top: 1px solid #222;
      display: flex; gap: 12px;
      justify-content: center; align-items: center;
      z-index: 100;
    }

    .btn {
      padding: 12px 24px; border-radius: 50px; border: none;
      font-size: 16px; font-family: inherit; cursor: pointer;
      transition: all 0.2s; display: flex; align-items: center; gap: 8px;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: #5abd7a; }
    .btn-primary.recording { background: var(--error); animation: pulse 1.5s infinite; }
    .btn-ghost { background: var(--surface); color: var(--text); border: 1px solid #333; }
    .btn-ghost:hover { background: var(--surface-hover); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(201,74,74,0.4); }
      50% { box-shadow: 0 0 0 8px rgba(201,74,74,0); }
    }

    .status {
      font-size: 13px; color: var(--text-dim);
      text-align: center; padding: 4px 8px;
      min-height: 20px;
    }
    .status.listening { color: var(--accent); }
    .status.error { color: var(--error); }

    .level-meter {
      width: 60px; height: 4px; background: #222;
      border-radius: 2px; overflow: hidden;
    }
    .level-meter-fill {
      height: 100%; width: 0%; background: var(--accent);
      transition: width 0.05s;
    }

    /* ── Engine badge ── */
    .engine-badge {
      font-size: 10px; color: var(--text-dim);
      padding: 2px 8px; border-radius: 10px;
      background: var(--surface); border: 1px solid #333;
      white-space: nowrap;
    }

    /* ── Debug panel ── */
    .debug-panel {
      position: fixed; bottom: 80px; left: 8px; right: 8px;
      background: rgba(0,0,0,0.85); color: #0f0;
      font-family: monospace; font-size: 10px;
      padding: 6px 8px; border-radius: 8px;
      max-height: 80px; overflow-y: auto;
      z-index: 99; display: none;
      border: 1px solid #333;
    }
    .debug-panel.visible { display: block; }

    .loader {
      text-align: center; padding: 60px 20px; color: var(--text-dim);
    }
    .loader .spinner {
      width: 32px; height: 32px; border: 3px solid #222;
      border-top-color: var(--accent); border-radius: 50%;
      animation: spin 0.8s linear infinite; margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 600px) {
      .page-container { padding: 8px 4px 160px; }
      .btn { padding: 10px 18px; font-size: 14px; }
      .topbar select { max-width: 110px; font-size: 12px; }
      .topbar .title { font-size: 16px; }
      .topbar { flex-wrap: wrap; gap: 6px; }
      .nav-btns { order: 3; width: 100%; justify-content: center; }
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
  <script type="module">
    // Use WASM-only ORT build — avoids removeChild DOM bug from the default build
    // which injects <script> tags into the DOM. The wasm-only module never touches the DOM.
    // This is the same approach used by Tilawa (github.com/yazinsai/tilawa).
    import * as ort from "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/ort.wasm.min.mjs";
    ort.env.wasm.numThreads = 1;
    ort.env.wasm.simd = true;
    ort.env.wasm.wasmPaths = 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/';
    window.ort = ort;
  </script>
</head>
<body>
  <div class="topbar">
    <span class="title">ترتيل</span>
    <select id="surah-select"></select>
    <select id="hizb-select"></select>
    <div class="nav-btns">
      <button class="nav-btn" id="prev-page" disabled>‹ السابق</button>
      <div class="page-jump">
        <input type="number" id="page-input" min="1" max="604" value="1">
        <span id="page-total">/ 604</span>
      </div>
      <button class="nav-btn" id="next-page" disabled>التالي ›</button>
    </div>
  </div>

  <div class="page-container" id="page-container">
    <div class="loader">
      <div class="spinner"></div>
      <p>جاري تحميل المصحف...</p>
    </div>
  </div>

  <div class="debug-panel" id="debug-panel"></div>

  <div class="controls">
    <span class="engine-badge" id="engine-badge">—</span>
    <div class="level-meter"><div class="level-meter-fill" id="level-fill"></div></div>
    <button class="btn btn-primary" id="recite-btn" disabled>
      <span id="recite-icon">🎙️</span>
      <span id="recite-text">ابدأ التلاوة</span>
    </button>
    <button class="btn btn-ghost" id="reset-btn">إعادة</button>
    <button class="btn btn-ghost" id="debug-btn" style="padding:8px 12px;font-size:12px">🐛</button>
  </div>

  <div class="status" id="status"></div>

  <script>
    // ============================================================
    // Tarteel-Warsh — Pure browser PWA
    // No backend, no Groq, no server-side processing.
    //
    // PRIMARY: Whisper Tiny ONNX (Quran-fine-tuned) via transformers.js
    //   Runs in Web Worker, word-level recognition, mistake detection.
    //   39MB model (quantized), runs on any browser with WASM.
    //
    // FALLBACK 1: Web Speech API (Chrome/Edge/Safari)
    // FALLBACK 2: Energy-based syllable counting (any browser)
    //
    // Line reveal: Whisper recognizes words → align against expected
    // page lines → reveal lines as words match → highlight mistakes
    // in red when recognized text doesn't match expected text.
    // ============================================================

    // ============================================================
    // State
    // ============================================================
    const State = {
      data: null,
      currentPage: 1,
      pageLines: [],
      currentLine: 0,
      allWords: [],
      isReciting: false,
      audioContext: null,
      mediaStream: null,
      analyser: null,
      vadInterval: null,
      segmentEls: [],
      imgEl: null,
      speechRecognition: null,
      // Word counting state
      thresholds: null,
      revealState: null,
      engine: null,  // 'whisper' | 'speech-api' | 'energy'
      adaptiveRate: 7.0,     // syllables/sec — tuned live after each line reveal
      totalSpeechMs: 0,      // accumulated speech duration (VAD/energy paths)
      syllableOverflow: 0,   // extra syllables carried to next page on auto-advance
      pageCount: 1,          // 1 on narrow screens, 2 on wide (spread mode)
      // Whisper engine state
      whisperWorker: null,
      whisperReady: false,
      audioWorkletNode: null,
      whisperAudioBuffer: [],
      lastTranscription: '',
      lastTranscriptionStable: false,
      energyInterval: null,    // energy-based fallback interval
      pageWordList: [],       // flat array of normalized words for current page(s)
      lineWordRanges: [],     // [{start, end}] per line — word indices into pageWordList
      currentWordIdx: 0,      // how many words have been matched
      mistakeLines: new Set(), // line indices with detected mistakes
    };

    // ============================================================
    // Debug logging
    // ============================================================
    function dbg(msg) {
      console.log('[DBG] ' + msg);
      try {
        const panel = document.getElementById('debug-panel');
        if (!panel || !panel.classList.contains('visible')) return;
        const time = new Date().toLocaleTimeString();
        panel.innerHTML = `<div>[${time}] ${msg}</div>` + panel.innerHTML;
        const lines = panel.children;
        if (lines.length > 20) panel.removeChild(lines[lines.length - 1]);
      } catch (e) { /* logging must never break calling code */ }
    }

    // ============================================================
    // Load data
    // ============================================================
    async function loadData() {
      try {
        const res = await fetch('quran-warsh-pages.json');
        State.data = await res.json();
        populateSurahSelect();
        populateHizbSelect();
        State.currentPage = 1;
        renderPage(1);
        document.getElementById('recite-btn').disabled = false;
      } catch (e) {
        document.getElementById('page-container').innerHTML =
          '<div class="loader"><p style="color:var(--error)">فشل تحميل المصحف</p></div>';
        console.error('Load error:', e);
      }
    }

    function populateSurahSelect() {
      const sel = document.getElementById('surah-select');
      sel.innerHTML = State.data.surahs.map(s =>
        `<option value="${s.num}">${s.num}. ${s.name}</option>`
      ).join('');
      sel.addEventListener('change', e => {
        const surahNum = parseInt(e.target.value);
        for (const page of State.data.pages) {
          if (page.ayahs.some(a => a.sura === surahNum)) {
            renderPage(page.page);
            break;
          }
        }
      });
    }

    // Hizb = half a juz (60 hizbs total). Each hizb ≈ 10 pages.
    function hizbFromPage(pageNum) {
      return Math.floor((pageNum - 1) * 60 / 604) + 1;
    }

    function pageFromHizb(hizbNum) {
      return Math.floor((hizbNum - 1) * 604 / 60) + 1;
    }

    function populateHizbSelect() {
      const sel = document.getElementById('hizb-select');
      const opts = [];
      for (let h = 1; h <= 60; h++) {
        const juz = Math.ceil(h / 2);
        const half = h % 2 === 1 ? '١' : '٢';
        const page = pageFromHizb(h);
        opts.push(`<option value="${h}">حزب ${h} • الجزء ${juz} • صفحة ${page}</option>`);
      }
      sel.innerHTML = opts.join('');
      sel.addEventListener('change', e => {
        const hizbNum = parseInt(e.target.value);
        renderPage(pageFromHizb(hizbNum));
      });
    }

    // ============================================================
    // Build per-line word arrays
    // ============================================================
    function buildPageLines(page) {
      const lineMap = new Map();
      for (const ayah of page.ayahs) {
        const words = ayah.words.filter(w => w && w.trim().length > 0);
        const lineSpan = ayah.lineEnd - ayah.lineStart + 1;
        if (lineSpan <= 1) {
          const ln = ayah.lineStart;
          if (!lineMap.has(ln)) lineMap.set(ln, []);
          lineMap.get(ln).push(...words.map(w => ({ text: w, sura: ayah.sura, aya: ayah.aya })));
        } else {
          const perLine = Math.ceil(words.length / lineSpan);
          for (let i = 0; i < lineSpan; i++) {
            const ln = ayah.lineStart + i;
            if (!lineMap.has(ln)) lineMap.set(ln, []);
            const chunk = words.slice(i * perLine, (i + 1) * perLine);
            lineMap.get(ln).push(...chunk.map(w => ({ text: w, sura: ayah.sura, aya: ayah.aya })));
          }
        }
      }
      const sortedLines = [...lineMap.keys()].sort((a, b) => a - b);
      return sortedLines.map(ln => ({
        lineNum: ln,
        words: lineMap.get(ln),
        revealed: false,
      }));
    }

    // ============================================================
    // Render page(s) with line overlays
    // On large screens (≥1024px), shows 2 pages side-by-side (spread).
    // Arabic reads right-to-left, so the right page is the current page
    // and the left page is the next page.
    // ============================================================

    // Detect how many pages to show based on viewport width
    function getPageCount() {
      return window.innerWidth >= 1024 ? 2 : 1;
    }

    function renderPage(pageNum) {
      const pageCount = getPageCount();
      const pages = [];
      for (let i = 0; i < pageCount; i++) {
        const pn = pageNum + i;
        if (pn > State.data.meta.totalPages) break;
        const page = State.data.pages.find(p => p.page === pn);
        if (page) pages.push(page);
      }
      if (pages.length === 0) return;

      State.currentPage = pageNum;
      State.pageCount = pages.length;

      // Build combined pageLines (right page first, then left page)
      State.pageLines = [];
      State.segmentEls = [];
      State.currentLine = 0;
      State.allWords = [];

      for (let pi = 0; pi < pages.length; pi++) {
        const pageLines = buildPageLines(pages[pi]);
        const lineOffset = State.pageLines.length;
        for (let li = 0; li < pageLines.length; li++) {
          pageLines[li]._pageIdx = pi;
          pageLines[li]._pageNum = pages[pi].page;
          State.pageLines.push(pageLines[li]);
          for (const w of pageLines[li].words) {
            State.allWords.push({ text: w.text, lineIdx: lineOffset + li });
          }
        }
      }

      // Build DOM
      const container = document.getElementById('page-container');
      container.innerHTML = '';

      const info = document.createElement('div');
      info.className = 'page-info';
      if (pages.length === 2) {
        info.textContent = `صفحة ${pages[0].page}-${pages[1].page} • الجزء ${pages[0].juz}`;
      } else {
        info.textContent = `صفحة ${pages[0].page} • الجزء ${pages[0].juz}`;
      }
      container.appendChild(info);

      // Create spread wrapper
      const spread = document.createElement('div');
      spread.className = 'spread';

      // Create overlays for each page
      const TOTAL_LINES = 15;
      // Text line positions — calibrated from actual mushaf image analysis.
      // Standard pages (912×1345): text spans ~5.9% to ~93.8% of image height.
      // Pages 1-2 (1039×1407, decorative frame): text spans ~6.5% to ~93.5%.
      // Using values that work across all page sizes.
      const TEXT_TOP = 5.9;
      const TEXT_BOTTOM = 93.8;
      const lineH = (TEXT_BOTTOM - TEXT_TOP) / TOTAL_LINES;
      const bands = [];
      for (let i = 0; i < TOTAL_LINES; i++) {
        bands.push({ top: TEXT_TOP + i * lineH, bottom: TEXT_TOP + (i + 1) * lineH });
      }

      for (let pi = 0; pi < pages.length; pi++) {
        const page = pages[pi];
        const pageDiv = document.createElement('div');
        pageDiv.className = 'mushaf-page';
        if (pages.length === 1) pageDiv.classList.add('single-mode');
        pageDiv.classList.add(pi === 0 ? 'right-page' : 'left-page');

        const img = document.createElement('img');
        img.src = `https://raw.githubusercontent.com/QuranHub/quran-pages-images/main/kfgqpc/warsh/${page.page}.jpg`;
        img.alt = `مصحف ورش - صفحة ${page.page}`;
        img.loading = pi === 0 ? 'eager' : 'lazy';

        // Create line overlays for this page
        const pageLines = State.pageLines.filter(pl => pl._pageIdx === pi);
        for (let li = 0; li < pageLines.length; li++) {
          const lineData = pageLines[li];
          const globalIdx = State.pageLines.indexOf(lineData);
          const bandIdx = Math.min(lineData.lineNum - 1, TOTAL_LINES - 1);
          const band = bands[bandIdx];

          const seg = document.createElement('div');
          seg.className = 'line-segment hidden';
          seg.style.top = band.top + '%';
          seg.style.height = (band.bottom - band.top) + '%';
          seg.dataset.lineIdx = globalIdx;
          pageDiv.appendChild(seg);
          State.segmentEls.push(seg);
        }

        img.onload = () => {
          dbg(`Image loaded: ${img.naturalWidth}x${img.naturalHeight} (page ${page.page})`);
        };

        pageDiv.appendChild(img);
        spread.appendChild(pageDiv);
      }

      container.appendChild(spread);
      dbg(`Created ${State.segmentEls.length} line overlays across ${pages.length} page(s)`);

      // If we're reciting and auto-advancing, kick off the new page
      if (State.isReciting && State._pendingAutoAdvance) {
        State._pendingAutoAdvance = false;
        startRecitationEngine();
      }

      // Update nav buttons
      const lastPage = pages[pages.length - 1].page;
      document.getElementById('prev-page').disabled = pageNum <= 1;
      document.getElementById('next-page').disabled = lastPage >= State.data.meta.totalPages;
      const pageInput = document.getElementById('page-input');
      pageInput.value = pageNum;
      pageInput.max = State.data.meta.totalPages;
      document.getElementById('page-total').textContent = '/ ' + State.data.meta.totalPages;
      const firstAyah = pages[0].ayahs[0];
      if (firstAyah) document.getElementById('surah-select').value = firstAyah.sura;
      document.getElementById('hizb-select').value = hizbFromPage(pageNum);
      const surahName = firstAyah ? firstAyah.suraName : '';
      if (pages.length === 2) {
        updateStatus(`صفحتا ${pages[0].page}-${pages[1].page} — ${surahName}`);
      } else {
        updateStatus(`صفحة ${pages[0].page} — ${surahName}`);
      }
    }

    // ============================================================
    // Line reveal logic
    // ============================================================
    function revealLine(lineIdx) {
      const seg = State.segmentEls[lineIdx];
      if (!seg) return;
      // Don't re-reveal already revealed lines
      if (seg.classList.contains('revealed')) return;
      seg.classList.remove('hidden', 'active');
      seg.classList.add('revealed');
      State.pageLines[lineIdx].revealed = true;
      dbg(`Revealed line ${lineIdx}`);

      if (lineIdx + 1 < State.segmentEls.length) {
        setActiveLine(lineIdx + 1);
      }
    }

    function setActiveLine(lineIdx) {
      State.segmentEls.forEach(s => {
        if (s.classList.contains('active')) {
          s.classList.remove('active');
          s.classList.add('hidden');
        }
      });
      const seg = State.segmentEls[lineIdx];
      if (seg && !seg.classList.contains('revealed')) {
        seg.classList.remove('hidden');
        seg.classList.add('active');
      }
    }

    // ============================================================
    // Syllable-based line reveal
    // Arabic syllable structure is deterministic from diacritized text.
    // Each vowel mark (fatha, damma, kasra, tanween, superscript alef)
    // = one syllable nucleus. We count syllables per line, and track
    // cumulative syllable thresholds. This is more stable than word
    // counting because it's immune to wasl (word joining).
    // ============================================================

    // Arabic diacritics — Unicode code points
    const AR_VOWELS = new Set([
      0x064E, // Fatha
      0x064F, // Damma
      0x0650, // Kasra
      0x064B, // Fathatan
      0x064C, // Dammatan
      0x064D, // Kasratan
      0x0670, // Superscript Alef (Maddah)
    ]);

    const AR_LONG_VOWELS = new Set([
      0x0627, // Alef
      0x0648, // Waw
      0x064A, // Ya
      0x0649, // Alef Maqsura
    ]);

    function countSyllables(word) {
      let count = 0;
      const chars = [...word];
      for (let i = 0; i < chars.length; i++) {
        const cp = chars[i].codePointAt(0);
        if (AR_VOWELS.has(cp)) {
          count++;
        } else if (AR_LONG_VOWELS.has(cp)) {
          // Long vowel: only new syllable if not preceded by a short vowel
          if (i > 0 && AR_VOWELS.has(chars[i-1].codePointAt(0))) {
            // Extends existing syllable, no new one
          } else if (i > 0 && AR_LONG_VOWELS.has(chars[i-1].codePointAt(0))) {
            count++;
          } else {
            count++;
          }
        }
      }
      return Math.max(1, count);
    }

    // Build cumulative syllable thresholds for each line
    function buildWordThresholds() {
      const lineSyllableCounts = State.pageLines.map(pl =>
        pl.words.reduce((sum, w) => sum + countSyllables(w.text), 0)
      );
      const cumulativeThresholds = [];
      let cum = 0;
      for (const sc of lineSyllableCounts) {
        cum += sc;
        cumulativeThresholds.push(cum);
      }
      dbg(`Syllable counts per line: [${lineSyllableCounts.join(', ')}]`);
      dbg(`Cumulative syllable thresholds: [${cumulativeThresholds.join(', ')}]`);
      return { lineSyllableCounts, cumulativeThresholds };
    }

    // ============================================================
    // Auto-advance: when all lines on current page are revealed,
    // advance to next page and continue reciting seamlessly.
    // ============================================================
    let autoAdvancePending = false;

    function autoAdvancePage(matchedWords, _) {
      // Avoid double-trigger
      if (autoAdvancePending) return;
      autoAdvancePending = true;

      const step = State.pageCount || 1;
      const nextPageNum = State.currentPage + step;

      // Check if there's a next page
      if (nextPageNum > State.data.meta.totalPages) {
        updateStatus(' ✓ اكتملت الصفحة! ', 'listening');
        autoAdvancePending = false;
        return;
      }

      dbg(`Auto-advancing to page ${nextPageNum} (step=${step})`);

      // Stop current engine without stopping recitation state
      stopRecitationEngine();

      updateStatus(` ← صفحة ${nextPageNum} `, 'listening');

      // Render next page(s) (this creates segments synchronously now)
      State._pendingAutoAdvance = true;
      renderPage(nextPageNum);
    }

    // Stop engine but keep isReciting true (for auto-advance)
    function stopRecitationEngine() {
      if (State.speechRecognition) {
        try { State.speechRecognition.stop(); } catch (e) {}
        State.speechRecognition = null;
      }
      if (State.vadInterval) { clearInterval(State.vadInterval); State.vadInterval = null; }
      if (State.mediaStream) { State.mediaStream.getTracks().forEach(t => t.stop()); State.mediaStream = null; }
      if (State.audioContext) {
        try { State.audioContext.close(); } catch(e) {}
        State.audioContext = null;
      }
      State.analyser = null;
      State.engine = null;
      updateEngineBadge();
      document.getElementById('level-fill').style.width = '0%';
    }

    function revealUpToWordCount(spokenSyllables, thresholds, state) {
      while (state.nextLineToReveal < thresholds.cumulativeThresholds.length &&
             spokenSyllables >= thresholds.cumulativeThresholds[state.nextLineToReveal]) {
        if (state.nextLineToReveal < State.pageLines.length) {
          revealLine(state.nextLineToReveal);
          dbg(`Revealed line ${state.nextLineToReveal} at syllable ${spokenSyllables}/${thresholds.cumulativeThresholds[state.nextLineToReveal]}`);
          State.currentLine = state.nextLineToReveal + 1;
        }
        state.nextLineToReveal++;
      }

      // ── Adaptive rate: after revealing a line, measure actual syl/sec ──
      if (State.totalSpeechMs > 1000 && state.nextLineToReveal > 1) {
        const actualRate = spokenSyllables / (State.totalSpeechMs / 1000);
        // Smooth: weight old rate 60%, new measurement 40%
        State.adaptiveRate = State.adaptiveRate * 0.6 + actualRate * 0.4;
        State.adaptiveRate = Math.max(3.0, Math.min(15.0, State.adaptiveRate));
        dbg(`Adaptive rate: ${State.adaptiveRate.toFixed(2)} syl/sec (measured ${actualRate.toFixed(2)})`);
      }

      if (State.currentLine < State.pageLines.length) {
        setActiveLine(State.currentLine);
        const remaining = thresholds.cumulativeThresholds[State.currentLine] - spokenSyllables;
        const rateInfo = State.totalSpeechMs > 1000 ? ` • ${State.adaptiveRate.toFixed(1)} م/ث` : '';
        updateStatus(` السطر ${State.currentLine + 1} — بقيت ${Math.max(0, remaining)} مقطع${rateInfo} `, 'listening');
      } else {
        // Page complete — auto-advance to next page
        autoAdvancePage(spokenSyllables, thresholds);
      }
    }

    // ============================================================
    // Arabic text normalization + Levenshtein (from Tilawa project)
    // ============================================================
    const DIACRITICS_RE = /[\u0610-\u061A\u064B-\u065F\u0670\u06D6-\u06DE\u06DF-\u06ED\u0640]/g;
    const NORM_MAP = {
      '\u0623': '\u0627', '\u0625': '\u0627', '\u0622': '\u0627', '\u0671': '\u0627',
      '\u0629': '\u0647', '\u0649': '\u064A',
    };
    function normalizeArabic(text) {
      text = text.replace(/\ufeff/g, '');
      text = text.replace(DIACRITICS_RE, '');
      text = text.replace(/./g, ch => NORM_MAP[ch] ?? ch);
      return text.split(/\s+/).filter(Boolean).join(' ');
    }

    function levenshteinRatio(a, b) {
      if (a === b) return 1.0;
      if (!a.length || !b.length) return 0.0;
      const aLen = a.length, bLen = b.length;
      const dp = Array(bLen + 1).fill(0).map((_, i) => i);
      for (let i = 1; i <= aLen; i++) {
        let prev = dp[0]; dp[0] = i;
        for (let j = 1; j <= bLen; j++) {
          const tmp = dp[j];
          dp[j] = Math.min(dp[j] + 1, dp[j - 1] + 1, prev + (a[i - 1] === b[j - 1] ? 0 : 1));
          prev = tmp;
        }
      }
      const dist = dp[bLen];
      return 1.0 - dist / Math.max(aLen, bLen);
    }

    // ============================================================
    // Build word list for current page(s)
    // Each line's text is normalized to a word array.
    // We track cumulative word ranges per line.
    // ============================================================
    function buildPageWordList() {
      State.pageWordList = [];
      State.lineWordRanges = [];
      for (let i = 0; i < State.pageLines.length; i++) {
        const line = State.pageLines[i];
        // pageLines[i].words is an array of {text, sura, aya} objects
        // from buildPageLines(). Join all word texts into one string.
        let text = '';
        if (line.words && line.words.length > 0) {
          text = line.words.map(w => w.text || w).join(' ');
        } else if (line.text) {
          text = line.text;
        }
        const words = normalizeArabic(text).split(' ').filter(Boolean);
        const start = State.pageWordList.length;
        State.pageWordList.push(...words);
        State.lineWordRanges.push({ start, end: State.pageWordList.length });
      }
      dbg(`Built page word list: ${State.pageWordList.length} words across ${State.lineWordRanges.length} lines`);
    }

    // ============================================================
    // Word alignment — match recognized words against expected page words
    // Uses fuzzy matching (Levenshtein ≥ 0.70) with lookahead (skip up to 5)
    // Returns: { matchedWords, currentLine, mistakes }
    // ============================================================
    function alignWords(recognizedText) {
      const recognizedWords = normalizeArabic(recognizedText).split(' ').filter(Boolean);
      if (!recognizedWords.length) return { matchedCount: 0, newLine: State.currentLine, mistakes: [] };

      const LOOKAHEAD = 5;
      const MATCH_THRESHOLD = 0.70;
      // A recognized word whose BEST candidate ratio falls below this is
      // considered "a completely different word" — flag immediately,
      // no need to wait for a second consecutive miss.
      const MISTAKE_THRESHOLD = 0.35;
      let wordPtr = State.currentWordIdx;
      const mistakes = [];
      let matchedCount = 0;
      let unmatchedCount = 0;

      const lineOfWordIdx = (idx) => {
        for (let li = 0; li < State.lineWordRanges.length; li++) {
          const r = State.lineWordRanges[li];
          if (idx >= r.start && idx < r.end) return li;
        }
        return -1;
      };

      for (const recWord of recognizedWords) {
        if (wordPtr >= State.pageWordList.length) break;
        const limit = Math.min(wordPtr + LOOKAHEAD, State.pageWordList.length);
        let found = false;
        let bestRatio = 0;
        for (let j = wordPtr; j < limit; j++) {
          const expected = State.pageWordList[j];
          const ratio = levenshteinRatio(recWord, expected);
          if (ratio > bestRatio) bestRatio = ratio;
          if (ratio >= MATCH_THRESHOLD) {
            // Check if words between wordPtr and j were skipped (potential mistakes)
            for (let k = wordPtr; k < j; k++) {
              const li = lineOfWordIdx(k);
              if (li !== -1) mistakes.push(li);
            }
            wordPtr = j + 1;
            matchedCount++;
            found = true;
            break;
          }
        }
        // If no match found, the recited word is wrong/unexpected
        if (!found) {
          unmatchedCount++;
          if (bestRatio < MISTAKE_THRESHOLD) {
            // Completely different word — flag its expected line right away.
            const li = lineOfWordIdx(wordPtr);
            if (li !== -1) mistakes.push(li);
          } else if (unmatchedCount >= 2) {
            // Borderline/ambiguous misses: only flag after 2+ in a row.
            const li = lineOfWordIdx(wordPtr);
            if (li !== -1) mistakes.push(li);
          }
        } else {
          unmatchedCount = 0;
        }
      }

      // Determine the currently ACTIVE line: the first line whose word
      // range is not yet fully covered by wordPtr. Lines strictly before
      // this one have been fully recited.
      let newLine = State.lineWordRanges.length;
      for (let li = 0; li < State.lineWordRanges.length; li++) {
        const r = State.lineWordRanges[li];
        if (wordPtr < r.end) {
          newLine = li;
          break;
        }
      }

      if (unmatchedCount > 0 || mistakes.length > 0) {
        dbg(`alignWords: ${matchedCount} matched, ${unmatchedCount} unmatched, ${mistakes.length} mistakes`);
      }
      return { matchedCount, newLine, mistakes, newWordIdx: wordPtr };
    }

    // ============================================================
    // Mark a line as having a mistake (red border)
    // ============================================================
    function markMistake(lineIdx) {
      if (State.mistakeLines.has(lineIdx)) return;
      State.mistakeLines.add(lineIdx);
      const seg = State.segmentEls[lineIdx];
      if (seg) {
        // Keep the line hidden (dark overlay) but add red border.
        // Only manual tap-reveal will reveal it.
        seg.classList.remove('active');
        seg.classList.add('hidden', 'mistake');
        dbg(`⚠ Mistake on line ${lineIdx + 1} — hidden + red border (tap to reveal)`);
      }
    }

    // ============================================================
    // Whisper engine — uses Web Worker + AudioWorklet
    // ============================================================
    async function initWhisperWorker() {
      if (State.whisperWorker) return State.whisperReady;
      try {
        dbg('Creating Whisper worker...');
        State.whisperWorker = new Worker('whisper-worker.js', { type: 'module' });
        State.whisperWorker.onmessage = (e) => {
          const msg = e.data;
          if (msg.type === 'loading' || msg.type === 'loading_progress') {
            const pct = msg.percent || 0;
            dbg(`Whisper loading: ${pct}%`);
            updateStatus(` تحميل النموذج ${pct}%`, 'loading');
          } else if (msg.type === 'ready') {
            State.whisperReady = true;
            dbg('Whisper model ready!');
            if (State.isReciting) {
              switchToWhisperEngine();
            }
          } else if (msg.type === 'transcription') {
            handleWhisperTranscription(msg);
          } else if (msg.type === 'error') {
            dbg('Whisper error: ' + msg.message);
          }
        };
        State.whisperWorker.onerror = (e) => {
          dbg('Whisper worker FAILED: ' + (e.message || e.filename + ':' + e.lineno));
          updateStatus(' فشل تحميل النموذج ', 'error');
        };
        State.whisperWorker.postMessage({ type: 'init' });
        return false; // not ready yet
      } catch (e) {
        dbg('Failed to create Whisper worker: ' + e.message);
        return false;
      }
    }

    // Switch from fallback engine to Whisper — stop old engine first
    async function switchToWhisperEngine() {
      dbg('Switching to Whisper engine...');
      // Stop Speech API if running
      if (State.speechRecognition) {
        try { State.speechRecognition.stop(); } catch (e) {}
        State.speechRecognition = null;
        State.speechApiAbandoned = true; // prevent restart
      }
      // Stop VAD/energy interval if running (energy engine also uses vadInterval)
      if (State.vadInterval) {
        clearInterval(State.vadInterval);
        State.vadInterval = null;
      }
      // Stop energy interval if separately set
      if (State.energyInterval) {
        clearInterval(State.energyInterval);
        State.energyInterval = null;
      }
      State.engine = 'whisper';
      updateEngineBadge();
      await startWhisperAudioCapture();
    }

    async function startWhisperAudioCapture() {
      try {
        // Reuse existing AudioContext or create new one
        if (!State.audioContext || State.audioContext.state === 'closed') {
          State.audioContext = new AudioContext();
        }
        if (State.audioContext.state === 'suspended') {
          await State.audioContext.resume();
        }
        await State.audioContext.audioWorklet.addModule('audio-processor.js');
        const source = State.audioContext.createMediaStreamSource(State.mediaStream);
        const node = new AudioWorkletNode(State.audioContext, 'audio-stream-processor');
        State.audioWorkletNode = node;
        node.port.onmessage = (e) => {
          if (!State.isReciting || !State.whisperReady) return;
          const samples = new Float32Array(e.data);
          // Send to Whisper worker for inference (transferable, zero-copy)
          State.whisperWorker.postMessage({ type: 'audio', samples }, [samples.buffer]);
        };
        source.connect(node);
        dbg('AudioWorklet connected to Whisper worker');
        updateStatus(' يستمع (Whisper) ', 'listening');
      } catch (e) {
        dbg('AudioWorklet failed: ' + e.message + ' — falling back to Speech API');
        // Fall back to old engine
        startRecitationEngine();
      }
    }

    function handleWhisperTranscription(msg) {
      if (!State.isReciting) return;
      const text = msg.text.trim();
      if (!text) {
        dbg('Whisper: empty transcription, skipping');
        return;
      }

      dbg(`Whisper transcribed: "${text.substring(0, 60)}${text.length > 60 ? '...' : ''}"`);

      // Decode stability gate (from Tilawa): if the transcription is very
      // different from the previous one, it might be an unstable decode.
      // But since we accumulate audio, the full text will always grow.
      // So we only compare the LAST N words to check stability of the latest portion.
      if (State.lastTranscription) {
        // Extract the new portion (text after the last known good transcription)
        const prevWords = normalizeArabic(State.lastTranscription).split(' ').filter(Boolean);
        const currWords = normalizeArabic(text).split(' ').filter(Boolean);
        // If current starts with most of previous, extract the new tail
        if (currWords.length > prevWords.length) {
          const overlap = prevWords.filter((w, i) => currWords[i] === w).length;
          const overlapRatio = overlap / prevWords.length;
          if (overlapRatio > 0.5) {
            // Good overlap — extract new words
            const newWords = currWords.slice(prevWords.length);
            if (newWords.length === 0) {
              dbg('Whisper: no new words since last transcription');
              return;
            }
            // Only align the new portion
            const newText = newWords.join(' ');
            const result = alignWords(newText);
            processAlignment(result, text);
            State.lastTranscription = text;
            return;
          }
        }
        // Low overlap — transcription changed significantly (unstable decode)
        // Use a lower threshold: only skip if it's wildly different
        const stability = levenshteinRatio(text, State.lastTranscription);
        if (stability < 0.30) {
          dbg(`Whisper: transcription very unstable (${(stability*100).toFixed(0)}%) — skipping`);
          State.lastTranscription = text;
          return;
        }
      }

      State.lastTranscription = text;

      // Align recognized words against expected page text
      const result = alignWords(text);
      processAlignment(result, text);
    }

    // Process alignment result — reveal lines, mark mistakes
    function processAlignment(result, fullText) {
      if (result.matchedCount === 0) {
        dbg('Whisper: no words matched page text');
        return;
      }

      // Mark mistakes
      for (const lineIdx of result.mistakes) {
        markMistake(lineIdx);
      }

      // Reveal lines that are now FULLY recited (strictly before the
      // current in-progress line). The current line itself stays hidden
      // until the recitation moves past it — this is what makes reveal
      // happen only after a line is completely recited, not mid-line.
      State.currentWordIdx = result.newWordIdx;
      const oldLine = State.currentLine;
      State.currentLine = result.newLine;

      for (let li = oldLine; li < result.newLine && li < State.segmentEls.length; li++) {
        const seg = State.segmentEls[li];
        if (seg && !seg.classList.contains('revealed')) {
          seg.classList.remove('hidden', 'active');
          seg.classList.add('revealed');
          dbg(`Whisper: revealed line ${li + 1}`);
        }
      }

      // Set active line
      if (State.currentLine < State.segmentEls.length) {
        setActiveLine(State.currentLine);
        const total = State.pageWordList.length;
        const matched = State.currentWordIdx;
        const pct = Math.round(matched / total * 100);
        const mistakeInfo = State.mistakeLines.size > 0 ? ` • ⚠ ${State.mistakeLines.size} خطأ` : '';
        updateStatus(` السطر ${State.currentLine + 1} — ${matched}/${total} كلمة (${pct}%)${mistakeInfo}`, 'listening');
      }

      // Auto-advance when page complete
      if (State.currentWordIdx >= State.pageWordList.length * 0.95) {
        dbg('Page complete via word alignment — auto-advancing');
        autoAdvancePage(State.currentWordIdx, null);
      }
    }

    // ============================================================
    // Recitation — word-alignment only (Tilawa approach).
    // No syllable counting, no VAD, no energy fallback.
    // Lines reveal ONLY when all their words are matched.
    // Mistakes (wrong word, word skip) → hidden + red border.
    // ============================================================

    async function startReciting() {
      State.isReciting = true;
      updateReciteButton();
      updateStatus(' يرتل... ', 'listening');
      setActiveLine(State.currentLine);

      // Build word list for word alignment
      buildPageWordList();
      State.currentWordIdx = 0;
      State.mistakeLines.clear();
      State.lastTranscription = '';

      // Step 1: Request mic permission
      try {
        dbg('Requesting mic permission...');
        State.mediaStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            channelCount: 1,
            sampleRate: 16000,
            echoCancellation: true,
            noiseSuppression: true,
          }
        });
        dbg('Mic permission granted');
      } catch (e) {
        dbg('Mic permission denied: ' + e.message);
        updateStatus(' يجب السماح بالميكروفون لبدء التلاوة ', 'error');
        State.isReciting = false;
        updateReciteButton();
        return;
      }

      // Try Whisper engine first — load model, show loading status.
      // While Whisper loads, use Speech API as temporary fallback.
      if (!State.whisperReady) {
        dbg('Whisper not ready — initializing...');
        updateStatus(' تحميل النموذج... ', 'loading');
        initWhisperWorker();
        // Start Speech API as temporary fallback — will be replaced when Whisper is ready
        dbg('Starting Speech API as temporary fallback while Whisper loads...');
        startRecitationEngine();
      } else {
        // Whisper already loaded — use it directly
        dbg('Whisper ready — starting audio capture');
        if (State.speechRecognition) {
          try { State.speechRecognition.stop(); } catch (e) {}
          State.speechRecognition = null;
        }
        State.engine = 'whisper';
        updateEngineBadge();
        startWhisperAudioCapture();
      }
    }

    // Engine selector — called on first start and on auto-advance.
    // Uses Speech API (word alignment) as fallback while Whisper loads.
    async function startRecitationEngine() {
      // Reset auto-advance guard
      autoAdvancePending = false;

      // Build word list for the new page and reset alignment state
      buildPageWordList();
      State.currentWordIdx = 0;
      State.mistakeLines.clear();
      State.lastTranscription = '';
      setActiveLine(State.currentLine);

      // Try Web Speech API (Chrome, Edge, Safari — all platforms).
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (SpeechRecognition) {
        dbg('Web Speech API available — trying it');
        // Release the getUserMedia stream — Speech API manages its own mic
        if (State.mediaStream) {
          State.mediaStream.getTracks().forEach(t => t.stop());
          State.mediaStream = null;
        }
        try {
          startSpeechApiAlignment(SpeechRecognition);
          return;
        } catch (e) {
          dbg('Speech API start failed: ' + e.message);
        }
      } else {
        dbg('Web Speech API not available — waiting for Whisper');
        updateStatus(' تحميل النموذج... ', 'loading');
      }
    }

    // ── Web Speech API word alignment (Tilawa approach) ──
    // Uses Speech API to transcribe words, then aligns them against
    // the expected page text. Lines reveal only when fully matched.
    function startSpeechApiAlignment(SpeechRecognition) {
      const recognition = new SpeechRecognition();
      recognition.lang = 'ar-SA';
      recognition.continuous = true;
      recognition.interimResults = true;

      let speechApiWorking = false;
      let speechApiAbandoned = false;
      let lastTranscript = '';

      recognition.onstart = () => {
        speechApiWorking = true;
        State.engine = 'speech-api';
        updateEngineBadge();
        dbg('Speech API (re)started');
      };

      recognition.onresult = (event) => {
        if (!State.isReciting) return;

        // Build full transcript from all results
        let fullTranscript = '';
        for (let i = 0; i < event.results.length; i++) {
          fullTranscript += event.results[i][0].transcript + ' ';
        }
        fullTranscript = fullTranscript.trim();
        if (!fullTranscript) return;

        dbg(`Speech API: "${fullTranscript.substring(0, 60)}${fullTranscript.length > 60 ? '...' : ''}"`);

        // Align recognized words against expected page text
        const result = alignWords(fullTranscript);
        processAlignment(result, fullTranscript);
        lastTranscript = fullTranscript;
      };

      recognition.onerror = (e) => {
        dbg('Speech API error: ' + e.error);
        if (e.error === 'no-speech' || e.error === 'aborted') return;
        if (speechApiAbandoned) return;
        if (e.error === 'not-allowed' || e.error === 'service-not-allowed' ||
            e.error === 'network' || e.error === 'audio-capture' ||
            e.error === 'service-not-found' || e.error === 'bad-grammar') {
          dbg(`Speech API fatal error (${e.error}) — waiting for Whisper`);
          speechApiAbandoned = true;
          speechApiWorking = false;
          try { recognition.stop(); } catch (err) {}
          State.speechRecognition = null;
          // If Whisper isn't ready yet, show loading status
          if (!State.whisperReady) {
            updateStatus(' تحميل النموذج... ', 'loading');
          }
        }
      };

      recognition.onend = () => {
        if (speechApiAbandoned) return;
        if (State.isReciting && speechApiWorking && State.engine === 'speech-api') {
          dbg('Speech API ended, restarting...');
          try { recognition.start(); } catch (e) { dbg('Restart failed: ' + e.message); }
        }
      };

      State.speechRecognition = recognition;
      recognition.start();

      // Give it 3 seconds — if no onstart, wait for Whisper
      setTimeout(() => {
        if (!speechApiWorking && State.isReciting && !speechApiAbandoned) {
          dbg('Speech API did not start in 3s — waiting for Whisper');
          speechApiAbandoned = true;
          try { recognition.stop(); } catch (e) {}
          State.speechRecognition = null;
          if (!State.whisperReady) {
            updateStatus(' تحميل النموذج... ', 'loading');
          }
        }
      }, 3000);
    }

    // ── Silero VAD word counting (fallback) ──
    // Uses Silero VAD (2MB ONNX model) to detect speech segments.
    // Counts speech bursts as words — much more accurate than energy-based.
    // Runs entirely in-browser via ONNX Runtime Web WASM-only build.
    async function startEnergyBasedCounting() {
      try {
        // Wait for ORT module to load (ES modules load async)
        if (!window.ort) {
          dbg('Waiting for ORT module to load...');
          for (let i = 0; i < 50; i++) {  // wait up to 5 seconds
            if (window.ort) break;
            await new Promise(r => setTimeout(r, 100));
          }
        }
        if (!window.ort) {
          dbg('ORT module not loaded after 5s — falling back to energy-based');
          return startEnergyBasedFallback();
        }

        // Reuse existing mic stream if we already have one
        if (!State.mediaStream) {
          dbg('Requesting mic for VAD counting...');
          State.mediaStream = await navigator.mediaDevices.getUserMedia({
            audio: {
              channelCount: 1,
              sampleRate: 16000,
              echoCancellation: true,
              noiseSuppression: true,
            }
          });
        }
        dbg('Mic ready for VAD counting');

        State.audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
        if (State.audioContext.state === 'suspended') {
          await State.audioContext.resume();
        }
        dbg(`AudioContext sampleRate: ${State.audioContext.sampleRate} (requested 16000)`);

        const source = State.audioContext.createMediaStreamSource(State.mediaStream);
        State.analyser = State.audioContext.createAnalyser();
        State.analyser.fftSize = 512;
        State.analyser.smoothingTimeConstant = 0.3;
        source.connect(State.analyser);

        State.engine = 'silero-vad';
        updateEngineBadge();
        updateStatus(' يرتل... ', 'listening');

        // Load Silero VAD ONNX model
        let vadSession = null;
        let vadFailed = false;
        try {
          dbg('Loading Silero VAD model...');
          vadSession = await ort.InferenceSession.create('silero_vad.onnx?v=2', {
            executionProviders: ['wasm'],
            graphOptimizationLevel: 'all',
          });
          dbg(`Silero VAD loaded: ${vadSession.inputNames} → ${vadSession.outputNames}`);
        } catch (e) {
          dbg('Failed to load Silero VAD: ' + e.message + ' — falling back to energy-based');
          return startEnergyBasedFallback();
        }

        // VAD state: [h, c] — LSTM hidden states, shape [2, 1, 128]
        let vadState = new Float32Array(2 * 1 * 128); // zeros
        const SR = 16000;
        const CHUNK_SIZE = 512; // Silero expects 512 samples at 16kHz
        const SPEECH_THRESHOLD = 0.5;
        const SILENCE_THRESHOLD = 0.35;
        const MIN_SPEECH_MS = 250;  // ignore very short bursts
        const SILENCE_RESET_MS = 600; // end of speech segment

        // Detect whether this model takes 'sr' input (older full model)
        // or not (silero_vad_half). Pass sr only if needed.
        const hasSrInput = vadSession.inputNames.includes('sr');
        dbg(`VAD model inputs: ${vadSession.inputNames.join(',')} (sr=${hasSrInput})`);

        // Audio capture via ScriptProcessor (simple, works everywhere)
        const BUFFER_SIZE = 4096;
        const scriptProcessor = State.audioContext.createScriptProcessor(BUFFER_SIZE, 1, 1);
        let audioBuffer = [];
        let chunkCount = 0;

        scriptProcessor.onaudioprocess = (e) => {
          if (!State.isReciting) return;
          const input = e.inputBuffer.getChannelData(0);
          // Resample to 16kHz if AudioContext isn't 16kHz
          const ctxRate = State.audioContext.sampleRate;
          let copy;
          if (ctxRate !== 16000) {
            const ratio = 16000 / ctxRate;
            const outLen = Math.floor(input.length * ratio);
            copy = new Float32Array(outLen);
            for (let i = 0; i < outLen; i++) {
              const srcIdx = Math.floor(i / ratio);
              copy[i] = input[srcIdx];
            }
          } else {
            copy = new Float32Array(input.length);
            copy.set(input);
          }
          audioBuffer.push(copy);
          chunkCount++;
          if (chunkCount === 1) {
            dbg(`First audio chunk received: ${copy.length} samples, rate=${ctxRate}Hz → resampled to ${copy.length} samples`);
          }
        };

        const gainNode = State.audioContext.createGain();
        gainNode.gain.value = 0;
        source.connect(scriptProcessor);
        scriptProcessor.connect(gainNode);
        gainNode.connect(State.audioContext.destination);

        // Process audio in 512-sample chunks via Silero VAD
        // Instead of counting speech bursts as words, we estimate syllables
        // from total speech duration. In tarteel recitation, ~7 syllables/sec.
        let spokenSyllables = 0;
        let isSpeaking = false;
        let vadInferenceCount = 0;
        let vadErrorCount = 0;
        let vadProcessing = false;  // guard against overlapping setInterval calls
        let speechStart = 0;
        let lastSpeechTime = 0;
        let silenceStart = 0;
        let totalSpeechMs = 0;  // local speech duration for this engine session
        let lastUpdateSyllables = 0;
        let pageSpeechOffset = State._pageSpeechOffset || 0;  // speech ms from previous pages

        // Tarteel recitation pace: starts at 7 syl/sec, adapted live
        const SYLLABLES_PER_SEC = 7.0;

        async function processVadChunk() {
          if (!State.isReciting || vadFailed) return;
          if (vadProcessing) return;  // prevent overlapping calls
          vadProcessing = true;
          try {
            await processVadChunkInner();
          } finally {
            vadProcessing = false;
          }
        }

        async function processVadChunkInner() {

          // Need at least CHUNK_SIZE samples
          if (audioBuffer.length === 0) return;

          // Flatten available audio
          const totalLen = audioBuffer.reduce((s, a) => s + a.length, 0);
          if (totalLen < CHUNK_SIZE) return;

          const flat = new Float32Array(totalLen);
          let off = 0;
          for (const a of audioBuffer) { flat.set(a, off); off += a.length; }
          audioBuffer = [];

          // Process in 512-sample chunks
          const numChunks = Math.floor(flat.length / CHUNK_SIZE);
          for (let i = 0; i < numChunks; i++) {
            const chunk = flat.slice(i * CHUNK_SIZE, (i + 1) * CHUNK_SIZE);

            // Check if chunk has signal (not silence)
            let maxAmp = 0;
            for (let s = 0; s < chunk.length; s++) {
              const abs = Math.abs(chunk[s]);
              if (abs > maxAmp) maxAmp = abs;
            }

            // Run VAD inference
            const inputTensor = new ort.Tensor('float32', chunk, [1, CHUNK_SIZE]);
            const stateTensor = new ort.Tensor('float32', vadState, [2, 1, 128]);

            try {
              const feeds = {
                [vadSession.inputNames[0]]: inputTensor,
                [vadSession.inputNames[1]]: stateTensor,
              };
              if (hasSrInput) {
                feeds['sr'] = new ort.Tensor('int64', new BigInt64Array([BigInt(SR)]), []);
              }
              const results = await vadSession.run(feeds);

              // Get speech probability
              const output = results[vadSession.outputNames[0]];
              const prob = output.data[0];
              vadState = results[vadSession.outputNames[1]].data;

              // Log first few chunks for diagnostics
              if (vadInferenceCount < 5) {
                dbg(`VAD chunk ${vadInferenceCount}: prob=${prob.toFixed(3)} maxAmp=${maxAmp.toFixed(4)}`);
                vadInferenceCount++;
              } else if (vadInferenceCount === 5) {
                dbg(`VAD running — stopping verbose logs (prob=${prob.toFixed(3)})`);
                vadInferenceCount++;
              }

              // Update level meter
              document.getElementById('level-fill').style.width = Math.min(100, prob * 100) + '%';

              const now = Date.now();
              const chunkMs = (CHUNK_SIZE / SR) * 1000; // 32ms per chunk

              if (prob > SPEECH_THRESHOLD) {
                if (!isSpeaking) {
                  isSpeaking = true;
                  speechStart = now;
                  silenceStart = 0;
                  dbg(`VAD: speech started (prob=${prob.toFixed(3)})`);
                }
                // Accumulate speech duration
                totalSpeechMs += chunkMs;
                State.totalSpeechMs = totalSpeechMs + pageSpeechOffset;
                lastSpeechTime = now;
              } else if (prob < SILENCE_THRESHOLD) {
                if (isSpeaking) {
                  if (silenceStart === 0) silenceStart = now;
                  if (now - silenceStart > SILENCE_RESET_MS) {
                    isSpeaking = false;
                    silenceStart = 0;
                    dbg(`VAD: speech ended (total speech: ${totalSpeechMs.toFixed(0)}ms)`);
                  }
                }
              }

              // Estimate syllables from total speech duration using adaptive rate
              const estimatedSyllables = Math.round(totalSpeechMs / 1000 * State.adaptiveRate);
              if (estimatedSyllables > lastUpdateSyllables) {
                spokenSyllables = estimatedSyllables;
                lastUpdateSyllables = estimatedSyllables;
                revealUpToWordCount(spokenSyllables, State.thresholds, State.revealState);
              }
            } catch (e) {
              // ORT throws 'removeChild' DOM errors due to internal script cleanup races.
              // This is a known ORT Web bug. Switch to energy-based immediately.
              dbg('VAD inference error: ' + e.message + ' — switching to energy-based');
              vadFailed = true;
              clearInterval(State.vadInterval);
              startEnergyBasedFallback().catch(e2 => dbg('Energy fallback also failed: ' + e2.message));
              return;
            }
          }
        }

        // Poll for audio chunks every 64ms (process ~2-3 VAD chunks per tick)
        State.vadInterval = setInterval(processVadChunk, 64);

      } catch (e) {
        dbg('VAD mic error: ' + e.message);
        updateStatus(' فشل الميكروفون: ' + e.message, 'error');
        State.isReciting = false;
        updateReciteButton();
      }
    }

    // ── Energy-based fallback (if Silero VAD fails to load) ──
    async function startEnergyBasedFallback() {
      // Idempotent — don't start twice
      if (State.vadInterval && State.engine === 'energy') {
        dbg('Energy-based already running — skipping');
        return;
      }
      // Clear any existing VAD interval
      if (State.vadInterval) { clearInterval(State.vadInterval); State.vadInterval = null; }
      // Ensure we have mic + analyser (might not be set if VAD path failed early)
      if (!State.mediaStream) {
        dbg('Energy fallback: requesting mic...');
        State.mediaStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            channelCount: 1,
            sampleRate: 16000,
            echoCancellation: true,
            noiseSuppression: true,
          }
        });
      }
      if (!State.audioContext) {
        State.audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
        if (State.audioContext.state === 'suspended') await State.audioContext.resume();
      }
      if (!State.analyser) {
        const source = State.audioContext.createMediaStreamSource(State.mediaStream);
        State.analyser = State.audioContext.createAnalyser();
        State.analyser.fftSize = 512;
        State.analyser.smoothingTimeConstant = 0.3;
        source.connect(State.analyser);
      }

      dbg('Energy-based fallback ready');
      const dataArray = new Uint8Array(State.analyser.frequencyBinCount);
      let spokenSyllables = 0;
      let totalSpeechMs = 0;
      let pageSpeechOffset = State._pageSpeechOffset || 0;  // speech ms from previous pages
      let isSpeaking = false;
      let speechStartMs = 0;
      let lastUpdateSyllables = 0;
      let baseline = 0;
      const BASELINE_DECAY = 0.995;
      const START_THRESHOLD = 12;
      const STOP_THRESHOLD = 4;
      const SILENCE_RESET_MS = 600;
      const SYLLABLES_PER_SEC = 7.0;
      let silenceStart = 0;

      State.engine = 'energy';
      updateEngineBadge();
      updateStatus(' يرتل... ', 'listening');

      State.vadInterval = setInterval(() => {
        if (!State.isReciting) return;
        State.analyser.getByteTimeDomainData(dataArray);

        let sum = 0;
        for (let i = 0; i < dataArray.length; i++) {
          const v = (dataArray[i] - 128) / 128;
          sum += v * v;
        }
        const rms = Math.sqrt(sum / dataArray.length) * 100;
        document.getElementById('level-fill').style.width = Math.min(100, rms * 5) + '%';
        const now = Date.now();

        // Track whether we're in speech
        if (!isSpeaking) {
          if (rms > START_THRESHOLD) {
            isSpeaking = true;
            baseline = rms * 0.7;
            silenceStart = 0;
            speechStartMs = now;
            dbg(`Energy: speech started (rms=${rms.toFixed(1)})`);
            updateStatus(' يرتل... ', 'listening');
          }
          // Don't return here — fall through to process speech if we just started
        }

        if (isSpeaking) {
          baseline = baseline * BASELINE_DECAY + rms * (1 - BASELINE_DECAY);
          totalSpeechMs += 40; // interval is 40ms
          State.totalSpeechMs = totalSpeechMs + pageSpeechOffset;
        }

        // Estimate syllables from speech duration
        const estimatedSyllables = Math.round(totalSpeechMs / 1000 * State.adaptiveRate);
        if (estimatedSyllables > lastUpdateSyllables) {
          spokenSyllables = estimatedSyllables;
          lastUpdateSyllables = estimatedSyllables;
          dbg(`Energy: syl=${spokenSyllables} speechMs=${totalSpeechMs} rms=${rms.toFixed(1)} rate=${State.adaptiveRate.toFixed(1)}`);
          revealUpToWordCount(spokenSyllables, State.thresholds, State.revealState);
        }

        if (isSpeaking) {
          if (rms < STOP_THRESHOLD) {
            if (silenceStart === 0) silenceStart = now;
            if (now - silenceStart > SILENCE_RESET_MS) {
              isSpeaking = false;
              silenceStart = 0;
              baseline = 0;
              dbg(`Energy: speech ended (totalSpeechMs=${totalSpeechMs.toFixed(0)})`);
              updateStatus(' يستمع... ', 'listening');
            }
          } else {
            silenceStart = 0;
          }
        }
      }, 40);
    }

    // ============================================================
    // Stop recitation
    // ============================================================
    function stopReciting() {
      State.isReciting = false;
      autoAdvancePending = false;
      State._pendingAutoAdvance = false;
      if (State.speechRecognition) {
        try { State.speechRecognition.stop(); } catch (e) {}
        State.speechRecognition = null;
      }
      if (State.vadInterval) { clearInterval(State.vadInterval); State.vadInterval = null; }
      if (State.audioWorkletNode) { State.audioWorkletNode.disconnect(); State.audioWorkletNode = null; }
      if (State.whisperWorker && State.whisperReady) {
        State.whisperWorker.postMessage({ type: 'reset' });
      }
      if (State.mediaStream) { State.mediaStream.getTracks().forEach(t => t.stop()); State.mediaStream = null; }
      if (State.audioContext) { State.audioContext.close(); State.audioContext = null; }
      State.analyser = null;
      State.lastTranscription = '';
      State.engine = null;
      updateEngineBadge();
      document.getElementById('level-fill').style.width = '0%';
      State.segmentEls.forEach(s => {
        if (s.classList.contains('active')) {
          s.classList.remove('active');
          s.classList.add('hidden');
        }
      });
      // Report mistakes summary
      if (State.mistakeLines.size > 0) {
        updateStatus(` ⚠ ${State.mistakeLines.size} أخطاء في هذه الصفحة`, 'warning');
      } else {
        updateStatus('');
      }
      updateReciteButton();
    }

    // ============================================================
    // UI helpers
    // ============================================================
    function updateReciteButton() {
      const btn = document.getElementById('recite-btn');
      const icon = document.getElementById('recite-icon');
      const text = document.getElementById('recite-text');
      if (State.isReciting) {
        btn.classList.add('recording');
        icon.textContent = '⏹️';
        text.textContent = 'إيقاف';
      } else {
        btn.classList.remove('recording');
        icon.textContent = '🎙️';
        text.textContent = 'ابدأ التلاوة';
      }
    }

    function updateStatus(text, cls = '') {
      const el = document.getElementById('status');
      el.textContent = text;
      el.className = 'status ' + cls;
    }

    function updateEngineBadge() {
      const badge = document.getElementById('engine-badge');
      if (State.engine === 'whisper') badge.textContent = 'Whisper 🎙️';
      else if (State.engine === 'speech-api') badge.textContent = 'Speech API';
      else if (State.engine === 'silero-vad') badge.textContent = 'VAD';
      else if (State.engine === 'energy') badge.textContent = 'Energy';
      else badge.textContent = '—';
    }

    function resetPage() {
      stopReciting();
      renderPage(State.currentPage);
    }

    function nextPage() {
      const step = State.pageCount || 1;
      if (State.currentPage + step <= State.data.meta.totalPages) {
        stopReciting();
        renderPage(State.currentPage + step);
      }
    }

    function prevPage() {
      const step = State.pageCount || 1;
      if (State.currentPage - step >= 1) {
        stopReciting();
        renderPage(State.currentPage - step);
      } else if (State.currentPage > 1) {
        stopReciting();
        renderPage(1);
      }
    }

    // ============================================================
    // Manual line reveal (tap to reveal)
    // ============================================================
    function tapRevealNext() {
      // Reveal the next hidden line directly — no syllable counting.
      // This is the manual safety net: if a line is hidden (either not
      // yet recited or marked as mistake), a tap reveals it.
      for (let i = 0; i < State.segmentEls.length; i++) {
        const seg = State.segmentEls[i];
        if (seg && !seg.classList.contains('revealed')) {
          seg.classList.remove('hidden', 'active', 'mistake');
          seg.classList.add('revealed');
          State.pageLines[i].revealed = true;
          dbg(`Tap-revealed line ${i + 1}`);
          // Set active line to the next one
          if (i + 1 < State.segmentEls.length) {
            setActiveLine(i + 1);
          }
          return;
        }
      }
    }

    // ============================================================
    // Event listeners
    // ============================================================
    document.getElementById('recite-btn').addEventListener('click', () => {
      if (State.isReciting) stopReciting(); else startReciting();
    });
    document.getElementById('reset-btn').addEventListener('click', resetPage);
    document.getElementById('next-page').addEventListener('click', nextPage);
    document.getElementById('prev-page').addEventListener('click', prevPage);
    document.getElementById('page-input').addEventListener('change', e => {
      const page = parseInt(e.target.value);
      const max = State.data.meta.totalPages;
      if (isNaN(page) || page < 1 || page > max) {
        e.target.value = State.currentPage;
        return;
      }
      if (page !== State.currentPage) {
        stopReciting();
        renderPage(page);
      }
    });
    document.getElementById('page-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') e.target.blur();
    });
    document.getElementById('debug-btn').addEventListener('click', () => {
      document.getElementById('debug-panel').classList.toggle('visible');
    });

    // Tap-to-reveal: tap on the mushaf page to reveal the next line
    document.getElementById('page-container').addEventListener('click', () => {
      tapRevealNext();
    });

    document.addEventListener('keydown', e => {
      if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return;
      if (e.key === 'ArrowLeft') nextPage();
      if (e.key === 'ArrowRight') prevPage();
      if (e.key === ' ' || e.key === 'Enter') {
        e.preventDefault();
        tapRevealNext();
      }
    });

    // Re-render on viewport resize crossing the 1024px breakpoint
    let resizeTimer = null;
    window.addEventListener('resize', () => {
      if (resizeTimer) clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        const newCount = getPageCount();
        if (newCount !== State.pageCount) {
          const wasReciting = State.isReciting;
          if (wasReciting) stopReciting();
          renderPage(State.currentPage);
          if (wasReciting) {
            // Restart recitation on the new layout
            startReciting();
          }
        }
      }, 300);
    });

    // ============================================================
    // Init
    // ============================================================
    loadData();
  </script>
</body>
